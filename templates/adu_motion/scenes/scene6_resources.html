<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Scene 6: 极客开源交付</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", sans-serif;
      overflow: hidden;
      position: relative;
      color: #1e293b;
    }
    .top-status {
      position: absolute;
      top: 120px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
    }
    .badge-open {
      font-size: 28px;
      font-weight: 800;
      color: #4f46e5;
      background: #e0e7ff;
      padding: 8px 24px;
      border-radius: 999px;
    }
    .main-title {
      position: absolute;
      top: 220px;
      left: 70px;
      width: 940px;
      text-align: center;
      font-size: 54px;
      font-weight: 900;
      color: #0f172a;
    }
    .packages-container {
      position: absolute;
      top: 360px;
      left: 70px;
      width: 940px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .pkg-card {
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 32px;
      padding: 36px 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 25px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .pkg-card.active {
      border-color: #4f46e5;
      background: #f5f3ff;
      transform: translateY(-5px);
      box-shadow: 0 25px 45px rgba(79, 70, 229, 0.12);
    }
    .pkg-icon {
      font-size: 54px;
      width: 90px;
      height: 90px;
      background: #f8fafc;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pkg-name {
      font-size: 32px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .pkg-sub {
      font-size: 22px;
      font-weight: 600;
      color: #64748b;
    }
    .cta-box {
      position: absolute;
      bottom: 220px;
      left: 70px;
      width: 940px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-radius: 36px;
      padding: 40px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }
    .cta-heading {
      font-size: 32px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    .keyword-pill {
      display: inline-block;
      font-size: 56px;
      font-weight: 900;
      color: #facc15;
      background: rgba(250, 204, 21, 0.15);
      border: 3px dashed #facc15;
      padding: 10px 60px;
      border-radius: 24px;
      margin-bottom: 20px;
      letter-spacing: 4px;
    }
    .cta-sub {
      font-size: 24px;
      font-weight: 600;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="top-status">
    <div class="badge-open">实测资料脱敏开源</div>
    <div style="font-size: 28px; font-weight: 700; color: #64748b;">ETHAN LAB FREE ASSETS</div>
  </div>

  <h1 class="main-title">实测避坑原件 · 免费开源获取</h1>

  <div class="packages-container">
    <div class="pkg-card" id="p1">
      <div class="pkg-icon">📄</div>
      <div>
        <div class="pkg-name">《公司 PPT 母版规范排查清单.pdf》</div>
        <div class="pkg-sub">12 项大厂母版合规指标，周会交差前一键对照自保</div>
      </div>
    </div>

    <div class="pkg-card" id="p2">
      <div class="pkg-icon">💻</div>
      <div>
        <div class="pkg-name">《高压周报防翻车 Prompt 模板.md》</div>
        <div class="pkg-sub">强约束防数据造假与杜撰，精准输出标准二级大纲</div>
      </div>
    </div>
  </div>

  <div class="cta-box">
    <div class="cta-heading">在评论区回复下方暗号</div>
    <div class="keyword-pill">PPT</div>
    <div class="cta-sub">脱敏资料包原件直接发你 · 点赞收藏防踩雷</div>
  </div>

  <script src="../components/subtitles.js"></script>
  <script>
    window.film = {
      duration: 21.84,
      frame(t) {
        if (window.renderSubtitle) window.renderSubtitle('scene6', t);
        const p1 = document.getElementById('p1');
        const p2 = document.getElementById('p2');

        if (t >= 4.0) p1.classList.add('active'); else p1.classList.remove('active');
        if (t >= 8.5) p2.classList.add('active'); else p2.classList.remove('active');
      }
    };
  </script>
</body>
</html>
