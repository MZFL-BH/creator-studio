<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Scene 5: 生产级保命方案</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", sans-serif;
      overflow: hidden;
      position: relative;
      color: #1e293b;
    }
    .top-status {
      position: absolute;
      top: 120px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
    }
    .sop-tag {
      font-size: 28px;
      font-weight: 800;
      color: #2563eb;
      background: #dbeafe;
      padding: 8px 24px;
      border-radius: 999px;
    }
    .main-title {
      position: absolute;
      top: 220px;
      left: 70px;
      width: 940px;
      text-align: center;
      font-size: 52px;
      font-weight: 900;
      color: #0f172a;
    }
    .flow-steps {
      position: absolute;
      top: 360px;
      left: 70px;
      width: 940px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .step-box {
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 32px;
      padding: 36px 32px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.05);
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .step-box.active {
      border-color: #2563eb;
      background: #eff6ff;
      transform: scale(1.02);
      box-shadow: 0 20px 45px rgba(37, 99, 235, 0.12);
    }
    .step-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }
    .step-badge {
      background: #2563eb;
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 8px;
    }
    .step-name {
      font-size: 34px;
      font-weight: 900;
      color: #0f172a;
    }
    .step-desc {
      font-size: 24px;
      font-weight: 600;
      color: #475569;
      line-height: 1.4;
    }
    .code-pill {
      display: inline-block;
      margin-top: 10px;
      background: #e2e8f0;
      color: #0f172a;
      font-family: monospace;
      font-size: 22px;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
    }
    .result-card {
      position: absolute;
      bottom: 220px;
      left: 70px;
      width: 940px;
      background: #10b981;
      border-radius: 28px;
      padding: 35px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.25);
      transition: all 0.4s;
    }
    .result-title {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .result-sub {
      font-size: 24px;
      font-weight: 600;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="top-status">
    <div class="sop-tag">生产级落地 SOP</div>
    <div style="font-size: 28px; font-weight: 700; color: #64748b;">打工人保命两阶段法</div>
  </div>

  <h1 class="main-title">拒绝一键直出 · 正确的分工流程</h1>

  <div class="flow-steps">
    <!-- Step 1 -->
    <div class="step-box" id="s1">
      <div class="step-header">
        <div class="step-badge">阶段一</div>
        <div class="step-name">大模型只当架构师，不当美工</div>
      </div>
      <div class="step-desc">
        把杂乱长文档提炼成逻辑大纲与 Bullet points，施加强约束：
      </div>
      <div class="code-pill">约束：严禁修改原始数据，严禁生成 AI 假大空黑话</div>
    </div>

    <!-- Step 2 -->
    <div class="step-box" id="s2">
      <div class="step-header">
        <div class="step-badge">阶段二</div>
        <div class="step-name">回归本地生态 · 原生母版占位符</div>
      </div>
      <div class="step-desc">
        将大纲直接导入支持本地母版绑定的工具（插件 / 本地脚本），内容自动落入企业预设模板中。
      </div>
      <div class="code-pill">字体 · 品牌色 · Logo · 安全标 100% 继承</div>
    </div>
  </div>

  <div class="result-card" id="resCard" style="opacity: 0; transform: translateY(20px);">
    <div class="result-title">⚡️ 既有 AI 提速，又守住公司合规底线</div>
    <div class="result-sub">5 分钟生成规范 PPT，周会汇报稳稳过关</div>
  </div>

  <script src="../components/subtitles.js"></script>
  <script>
    window.film = {
      duration: 23.38,
      frame(t) {
        if (window.renderSubtitle) window.renderSubtitle('scene5', t);
        const s1 = document.getElementById('s1');
        const s2 = document.getElementById('s2');
        const res = document.getElementById('resCard');

        if (t >= 3.5) s1.classList.add('active'); else s1.classList.remove('active');
        if (t >= 11.0) s2.classList.add('active'); else s2.classList.remove('active');
        if (t >= 17.5) {
          res.style.opacity = 1;
          res.style.transform = 'translateY(0)';
        } else {
          res.style.opacity = 0;
          res.style.transform = 'translateY(20px)';
        }
      }
    };
  </script>
</body>
</html>
