<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Scene 1: 开场暴击</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", sans-serif;
      overflow: hidden;
      position: relative;
      color: #1e293b;
    }
    .top-status {
      position: absolute;
      top: 120px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
    }
    .tag {
      font-size: 28px;
      font-weight: 700;
      color: #ef4444;
      background: #fee2e2;
      padding: 8px 24px;
      border-radius: 999px;
      border: 1px solid #fca5a5;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pulse-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }
    .series {
      font-size: 26px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 1px;
    }
    .main-card {
      position: absolute;
      top: 320px;
      left: 70px;
      width: 940px;
      background: #ffffff;
      border-radius: 40px;
      border: 2px solid #e2e8f0;
      padding: 60px 50px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
      text-align: center;
      transform-origin: center;
    }
    .main-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      color: #0f172a;
      margin-bottom: 30px;
    }
    .main-title span.strike {
      color: #ef4444;
      text-decoration: line-through;
      margin-right: 15px;
    }
    .main-title span.highlight {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 40px;
    }
    .badge-item {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      transition: all 0.3s;
    }
    .badge-item.active {
      border-color: #ef4444;
      background: #fef2f2;
      transform: translateY(-5px);
    }
    .badge-icon {
      font-size: 54px;
      margin-bottom: 12px;
    }
    .badge-text {
      font-size: 32px;
      font-weight: 800;
      color: #1e293b;
    }
    .author-badge {
      position: absolute;
      bottom: 220px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      background: #ffffff;
      padding: 16px 36px;
      border-radius: 999px;
      border: 2px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .author-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 26px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .author-info {
      text-align: left;
    }
    .author-name {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
    }
    .author-desc {
      font-size: 20px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-status">
    <div class="tag">
      <div class="pulse-dot"></div>
      高危避坑实测
    </div>
    <div class="series">ETHAN LAB · 职场实测 #04</div>
  </div>

  <div class="main-card" id="card">
    <h1 class="main-title">
      你的 <span class="strike">AI 一键 PPT</span><br>
      <span class="highlight">真的该全删了！</span>
    </h1>
    <p style="font-size: 30px; color: #64748b; font-weight: 600; line-height: 1.5;">
      别再盲信神器一键交差<br>
      真实工位周会正在变成连环车祸现场
    </p>

    <div class="badge-grid">
      <div class="badge-item" id="b1">
        <div class="badge-icon">💥</div>
        <div class="badge-text">母版粉碎</div>
      </div>
      <div class="badge-item" id="b2">
        <div class="badge-icon">🤥</div>
        <div class="badge-text">暗中造假</div>
      </div>
      <div class="badge-item" id="b3">
        <div class="badge-icon">💣</div>
        <div class="badge-text">周会被挂</div>
      </div>
    </div>
  </div>

  <div class="author-badge">
    <div class="author-avatar">E</div>
    <div class="author-info">
      <div class="author-name">Ethan · 实测工程师</div>
      <div class="author-desc">拿真机击穿营销滤镜</div>
    </div>
  </div>

  <script src="../components/subtitles.js"></script>
  <script>
    window.film = {
      duration: 20.04,
      frame(t) {
        if (window.renderSubtitle) window.renderSubtitle('scene1', t);
        const card = document.getElementById('card');
        const b1 = document.getElementById('b1');
        const b2 = document.getElementById('b2');
        const b3 = document.getElementById('b3');

        // Card entrance (0 - 0.6s)
        if (t < 0.6) {
          const progress = t / 0.6;
          const scale = 0.8 + 0.2 * Math.sin(progress * Math.PI / 2);
          card.style.transform = `scale(${scale})`;
          card.style.opacity = progress;
        } else {
          card.style.transform = 'scale(1)';
          card.style.opacity = 1;
        }

        // Sequential pop badges
        if (t > 4.0) b1.classList.add('active'); else b1.classList.remove('active');
        if (t > 7.5) b2.classList.add('active'); else b2.classList.remove('active');
        if (t > 10.5) b3.classList.add('active'); else b3.classList.remove('active');
      }
    };
  </script>
</body>
</html>
