<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Scene 2: 格式关 · 母版粉碎</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", sans-serif;
      overflow: hidden;
      position: relative;
      color: #1e293b;
    }
    .top-status {
      position: absolute;
      top: 120px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
    }
    .step-tag {
      font-size: 28px;
      font-weight: 800;
      color: #2563eb;
      background: #dbeafe;
      padding: 8px 24px;
      border-radius: 999px;
    }
    .step-title {
      font-size: 30px;
      font-weight: 700;
      color: #0f172a;
    }
    .container {
      position: absolute;
      top: 260px;
      left: 70px;
      width: 940px;
      height: 1400px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .ppt-window {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }
    .window-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .file-pill {
      font-size: 24px;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .security-badge {
      background: #fee2e2;
      color: #dc2626;
      font-size: 20px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid #fca5a5;
    }
    .ppt-canvas {
      width: 100%;
      height: 480px;
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      border-radius: 20px;
      position: relative;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .corp-logo {
      font-size: 32px;
      font-weight: 900;
      color: #1e3a8a;
      letter-spacing: 2px;
      transition: all 0.5s;
    }
    .corp-logo.distorted {
      transform: scaleX(2.8) scaleY(0.6);
      color: #ef4444;
    }
    .shattered-box {
      border: 2px dashed #ef4444;
      background: rgba(239, 68, 68, 0.05);
      padding: 15px;
      border-radius: 10px;
      font-size: 22px;
      color: #dc2626;
      font-weight: 600;
    }
    .alert-box {
      background: #fffbeb;
      border: 3px solid #f59e0b;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.15);
      transition: all 0.4s;
    }
    .alert-header {
      font-size: 30px;
      font-weight: 800;
      color: #b45309;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }
    .alert-desc {
      font-size: 24px;
      font-weight: 600;
      color: #92400e;
      line-height: 1.4;
    }
    /* Stamp Slam */
    .stamp-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(3) rotate(-25deg);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .stamp-overlay.active {
      opacity: 1;
      transform: scale(1) rotate(-10deg);
    }
    .stamp-badge {
      border: 8px solid #dc2626;
      border-radius: 24px;
      padding: 20px 50px;
      font-size: 72px;
      font-weight: 900;
      color: #dc2626;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 50px rgba(220, 38, 38, 0.3);
      letter-spacing: 8px;
    }
    .shake {
      animation: screenShake 0.3s;
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 10px); }
      40% { transform: translate(8px, -8px); }
      60% { transform: translate(-6px, -4px); }
      80% { transform: translate(6px, 4px); }
    }
    .summary-card {
      background: #ffffff;
      border-radius: 24px;
      border: 2px solid #e2e8f0;
      padding: 30px;
      text-align: center;
    }
    .summary-text {
      font-size: 32px;
      font-weight: 800;
      color: #ef4444;
    }
  </style>
</head>
<body id="bodyRoot">
  <div class="top-status">
    <div class="step-tag">实测关卡 01</div>
    <div class="step-title">格式关 · 公司母版一碰就碎</div>
  </div>

  <div class="container">
    <div class="ppt-window" id="windowCard">
      <div class="window-header">
        <div class="file-pill">
          <span style="font-size: 28px;">📊</span> 集团核心经营汇报_标准母版.pptx
        </div>
        <div class="security-badge">保密级母版</div>
      </div>

      <div class="ppt-canvas">
        <div class="corp-logo" id="corpLogo">COMPANY BRAND LOGO</div>
        <div id="shatterArea" style="display: none;" class="shattered-box">
          ⚠️ 文本框已解体为 32 个碎片文本层，字体由 Arial 自动降级为宋体
        </div>
        <div style="font-size: 20px; color: #94a3b8; font-weight: 600;">
          Confidential · Page 1 / 24 · Standard Header & Footer Locked
        </div>
      </div>

      <div class="stamp-overlay" id="stamp">
        <div class="stamp-badge">【强制篡改】</div>
      </div>
    </div>

    <div class="alert-box" id="alertBox" style="opacity: 0; transform: translateY(20px);">
      <div class="alert-header">
        <span>⚠️</span> 某主流 AI PPT 工具强制拦截
      </div>
      <div class="alert-desc">
        “检测到母版包含复杂占位符与保密版式，平台无法继承。已为您强制替换为商城商务风微粒体模板。”
      </div>
    </div>

    <div class="summary-card" id="summaryCard" style="opacity: 0;">
      <div class="summary-text">
        调格式花的时间，比自己手搓还要慢一倍！
      </div>
    </div>
  </div>

  <script src="../components/subtitles.js"></script>
  <script>
    window.film = {
      duration: 29.42,
      frame(t) {
        if (window.renderSubtitle) window.renderSubtitle('scene2', t);
        const alertBox = document.getElementById('alertBox');
        const stamp = document.getElementById('stamp');
        const root = document.getElementById('bodyRoot');
        const logo = document.getElementById('corpLogo');
        const shatter = document.getElementById('shatterArea');
        const summary = document.getElementById('summaryCard');

        // Alert popup at 9s
        if (t >= 8.5) {
          alertBox.style.opacity = 1;
          alertBox.style.transform = 'translateY(0)';
        } else {
          alertBox.style.opacity = 0;
          alertBox.style.transform = 'translateY(20px)';
        }

        // Stamp slam at 12s
        if (t >= 11.5) {
          if (!stamp.classList.contains('active')) {
            stamp.classList.add('active');
            root.classList.add('shake');
            setTimeout(() => root.classList.remove('shake'), 400);
          }
        } else {
          stamp.classList.remove('active');
        }

        // Broken export view at 18s
        if (t >= 17.5) {
          logo.classList.add('distorted');
          shatter.style.display = 'block';
        } else {
          logo.classList.remove('distorted');
          shatter.style.display = 'none';
        }

        // Summary text at 24s
        if (t >= 23.5) {
          summary.style.opacity = 1;
        } else {
          summary.style.opacity = 0;
        }
      }
    };
  </script>
</body>
</html>
