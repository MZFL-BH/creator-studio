<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Scene 4: 工位真相破局</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", sans-serif;
      overflow: hidden;
      position: relative;
      color: #1e293b;
    }
    .top-status {
      position: absolute;
      top: 120px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
    }
    .insight-tag {
      font-size: 28px;
      font-weight: 800;
      color: #059669;
      background: #d1fae5;
      padding: 8px 24px;
      border-radius: 999px;
    }
    .title-box {
      position: absolute;
      top: 240px;
      left: 70px;
      width: 940px;
      text-align: center;
    }
    .main-heading {
      font-size: 56px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 20px;
    }
    .sub-heading {
      font-size: 30px;
      font-weight: 600;
      color: #64748b;
    }
    .rules-container {
      position: absolute;
      top: 480px;
      left: 70px;
      width: 940px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .rule-card {
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 35px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .rule-card.active {
      border-color: #059669;
      background: #f0fdf4;
      transform: translateY(-8px);
      box-shadow: 0 25px 50px rgba(5, 150, 105, 0.12);
    }
    .rule-number {
      width: 90px;
      height: 90px;
      border-radius: 28px;
      background: #f1f5f9;
      color: #475569;
      font-size: 42px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rule-card.active .rule-number {
      background: #059669;
      color: #ffffff;
    }
    .rule-content {
      text-align: left;
    }
    .rule-main {
      font-size: 38px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .rule-desc {
      font-size: 26px;
      font-weight: 600;
      color: #64748b;
      line-height: 1.4;
    }
    .solution-banner {
      position: absolute;
      bottom: 220px;
      left: 70px;
      width: 940px;
      background: #ffffff;
      border: 3px solid #3b82f6;
      border-radius: 28px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(59, 130, 246, 0.1);
      transition: all 0.4s;
    }
    .banner-title {
      font-size: 34px;
      font-weight: 900;
      color: #1d4ed8;
      margin-bottom: 8px;
    }
    .banner-sub {
      font-size: 24px;
      font-weight: 600;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="top-status">
    <div class="insight-tag">打工人实操共识</div>
    <div style="font-size: 28px; font-weight: 700; color: #64748b;">职场生存法则</div>
  </div>

  <div class="title-box">
    <h1 class="main-heading">为什么你用 AI 做 PPT 这么痛苦？</h1>
    <p class="sub-heading">因为市面上 90% 的所谓“神器”，只是排版玩具</p>
  </div>

  <div class="rules-container">
    <div class="rule-card" id="r1">
      <div class="rule-number">01</div>
      <div class="rule-content">
        <div class="rule-main">母版必须是公司的</div>
        <div class="rule-desc">公司字体、标准色值、页眉页脚与安全保密标识绝不可侵犯</div>
      </div>
    </div>

    <div class="rule-card" id="r2">
      <div class="rule-number">02</div>
      <div class="rule-content">
        <div class="rule-main">数据绝对不能撒谎</div>
        <div class="rule-desc">汇报任何虚增与脑补都是灾难，严禁大模型擅自改动数值</div>
      </div>
    </div>
  </div>

  <div class="solution-banner" id="solBanner" style="opacity: 0; transform: translateY(20px);">
    <div class="banner-title">⚡️ 大模型骨架 + 原生母版两阶段法</div>
    <div class="banner-sub">真正能打、不踩雷的生产级解法</div>
  </div>

  <script src="../components/subtitles.js"></script>
  <script>
    window.film = {
      duration: 23.16,
      frame(t) {
        if (window.renderSubtitle) window.renderSubtitle('scene4', t);
        const r1 = document.getElementById('r1');
        const r2 = document.getElementById('r2');
        const banner = document.getElementById('solBanner');

        if (t >= 7.0) r1.classList.add('active'); else r1.classList.remove('active');
        if (t >= 11.5) r2.classList.add('active'); else r2.classList.remove('active');
        if (t >= 16.5) {
          banner.style.opacity = 1;
          banner.style.transform = 'translateY(0)';
        } else {
          banner.style.opacity = 0;
          banner.style.transform = 'translateY(20px)';
        }
      }
    };
  </script>
</body>
</html>
